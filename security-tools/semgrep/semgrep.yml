rules:
  - id: third-party.a01.public-controller
    message: Controller-wide public metadata may unintentionally expose protected operations.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(?s)@Public\(\).{0,120}@Controller'
    metadata: {criterion_id: TSC-A01-SEMGREP-PUBLIC-CONTROLLER, owasp: A01:2025, cwe: CWE-862, origin: project-custom, maturity: candidate}
  - id: third-party.a01.client-controlled-role
    message: Request-controlled role or capability enters authority data.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'role\s*:\s*(input|dto|request|body)\.(role|requestedRole|capability)'
    metadata: {criterion_id: TSC-A01-SEMGREP-CLIENT-ROLE, owasp: A01:2025, cwe: CWE-863, origin: project-custom, maturity: candidate}
  - id: third-party.a01.client-controlled-subject
    message: Request-controlled identity enters token subject or ownership scope.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'sub\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*\.(userId|ownerId|tenantId)'
    metadata: {criterion_id: TSC-A01-SEMGREP-CLIENT-SUBJECT, owasp: A01:2025, cwe: CWE-639, origin: project-custom, maturity: candidate}
  - id: third-party.a01.mass-assignment
    message: An untrusted DTO appears to be assigned wholesale to an entity.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'Object\.assign\([^,\n]+,\s*[A-Za-z_$][A-Za-z0-9_$]*\)'
    metadata: {criterion_id: TSC-A01-SEMGREP-MASS-ASSIGNMENT, owasp: A01:2025, cwe: CWE-915, origin: project-custom, maturity: candidate}
  - id: third-party.a01.input-controlled-outbound-target
    message: A request-controlled field appears to select an outbound request target.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(fetch|axios\.(get|post|request))\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.(url|host|target|callbackUrl)'
    metadata: {criterion_id: TSC-A01-SEMGREP-OUTBOUND-TARGET, owasp: A01:2025, cwe: CWE-918, origin: project-custom, maturity: candidate}
  - id: third-party.a01.jwt-without-expiry
    message: JWT signing appears to omit explicit bounded expiration configuration.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(sign|signAsync)\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'
    metadata: {criterion_id: TSC-A01-SEMGREP-JWT-EXPIRY, owasp: A01:2025, cwe: CWE-613, origin: project-custom, maturity: candidate}
  - id: third-party.a01.cross-site-auth-cookie
    message: SameSite=None cookie configuration requires contextual CSRF review.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'sameSite\s*:\s*["'']none["'']'
    metadata: {criterion_id: TSC-A01-SEMGREP-CROSS-SITE-COOKIE, owasp: A01:2025, cwe: CWE-352, origin: project-custom, maturity: candidate}
  - id: third-party.a02.security-secret-fallback
    message: A security-sensitive environment variable has an embedded fallback value.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(JWT_SECRET|DB_PASSWORD|DATABASE_PASSWORD|API_SECRET)[^\n]{0,80}(\|\||\?\?)[^\n]+'
    metadata: {criterion_id: TSC-A02-SEMGREP-SECRET-FALLBACK, owasp: A02:2025, cwe: CWE-798, origin: project-custom, maturity: candidate}
  - id: third-party.a02.internal-error-disclosure
    message: Internal exception detail appears to be returned to a client.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(message|error|detail)\s*:\s*(error|exception)\.(message|stack)'
    metadata: {criterion_id: TSC-A02-SEMGREP-ERROR-DISCLOSURE, owasp: A02:2025, cwe: CWE-209, origin: project-custom, maturity: candidate}
  - id: third-party.a02.cors-wildcard
    message: CORS origin is configured as a wildcard.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'origin\s*:\s*["'']\*["'']'
    metadata: {criterion_id: TSC-A02-SEMGREP-CORS-WILDCARD, owasp: A02:2025, cwe: CWE-942, origin: project-custom, maturity: candidate}
  - id: third-party.a02.typeorm-synchronize-enabled
    message: TypeORM schema synchronization is enabled.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'synchronize\s*:\s*true'
    metadata: {criterion_id: TSC-A02-SEMGREP-TYPEORM-SYNC, owasp: A02:2025, cwe: CWE-489, origin: project-custom, maturity: candidate}
  - id: third-party.a02.hardcoded-secret
    message: A JWT or database secret appears to be embedded in source.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(JWT_SECRET|jwtSecret|DB_PASSWORD|databasePassword)\s*[:=]\s*["''][^"'']{8,}["'']'
    metadata: {criterion_id: TSC-A02-SEMGREP-HARDCODED-SECRET, owasp: A02:2025, cwe: CWE-798, origin: project-custom, maturity: candidate}
  - id: third-party.a02.insecure-sensitive-cookie
    message: HttpOnly or Secure is explicitly disabled on a cookie.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(httpOnly|secure)\s*:\s*false'
    metadata: {criterion_id: TSC-A02-SEMGREP-INSECURE-COOKIE, owasp: A02:2025, cwe: CWE-614, origin: project-custom, maturity: candidate}
  - id: third-party.a02.unsafe-runtime-exposure
    message: Container privilege or database host-port exposure is configured.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(privileged\s*:\s*true|["'']?3306["'']?\s*:\s*["'']?3306["'']?)'
    metadata: {criterion_id: TSC-A02-SEMGREP-PRIVILEGED-CONTAINER, owasp: A02:2025, cwe: CWE-250, origin: project-custom, maturity: candidate}
  - id: third-party.a02.docker-socket-mount
    message: Docker daemon socket is mounted into a container.
    severity: ERROR
    languages: [generic]
    pattern-regex: '/var/run/docker\.sock\s*:\s*/var/run/docker\.sock'
    metadata: {criterion_id: TSC-A02-SEMGREP-DOCKER-SOCKET, owasp: A02:2025, cwe: CWE-250, origin: project-custom, maturity: candidate}
  - id: third-party.a02.swagger-unconditional
    message: Swagger setup appears to be enabled without an environment gate.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'SwaggerModule\.setup\('
    metadata: {criterion_id: TSC-A02-SEMGREP-SWAGGER-PRODUCTION, owasp: A02:2025, cwe: CWE-489, origin: project-custom, maturity: candidate}
  - id: third-party.a02.validation-pipe-not-strict
    message: Global ValidationPipe explicitly disables strict allowlisting.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'ValidationPipe\([^)]*(whitelist\s*:\s*false|forbidNonWhitelisted\s*:\s*false)'
    metadata: {criterion_id: TSC-A02-SEMGREP-VALIDATION-PIPE, owasp: A02:2025, cwe: CWE-1174, origin: project-custom, maturity: candidate}
  - id: third-party.a02.production-source-map
    message: Source maps appear to be explicitly enabled in build configuration.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(sourcemap|sourceMap)\s*:\s*true'
    metadata: {criterion_id: TSC-A02-SEMGREP-SOURCE-MAPS, owasp: A02:2025, cwe: CWE-540, origin: project-custom, maturity: candidate}
