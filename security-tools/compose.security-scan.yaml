services:
  semgrep:
    image: ${SEMGREP_IMAGE:-semgrep/semgrep:1.172.0-nonroot}
    profiles: [security-scan]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,uid=1000,gid=1000,mode=1777
      - /home/semgrep/.semgrep:rw,uid=1000,gid=1000,mode=0700
    volumes:
      - ${REPO_ROOT:?Set REPO_ROOT}/finalsource:/src:ro
      - ${REPO_ROOT}/security-tools/semgrep:/policy:ro
      - ${SCAN_OUTPUT_DIR:?Set SCAN_OUTPUT_DIR}:/output:rw
    command: [semgrep, scan, --config, /policy/semgrep.yml, --json-output, /output/semgrep.raw.json, /src]

  zap:
    image: ${ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:2.17.0}
    profiles: [security-scan]
    read_only: true
    working_dir: /zap/wrk
    tmpfs:
      - /tmp:rw,uid=1000,gid=1000,mode=1777
      - /home/zap/.ZAP:rw,uid=1000,gid=1000,mode=0700
      - /home/zap/.java:rw,uid=1000,gid=1000,mode=0700
    volumes:
      - ${REPO_ROOT}/security-tools/zap:/zap/policy:ro
      - ${SCAN_OUTPUT_DIR:?Set SCAN_OUTPUT_DIR}:/zap/wrk:rw
    networks: [app_network]
    command: [zap-api-scan.py, -t, "http://backend:3000/docs-json", -f, openapi, -c, /zap/policy/zap-rules.conf, -J, zap.raw.json, -r, zap.report.html]
